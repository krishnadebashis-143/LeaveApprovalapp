spring.application.name=leave-approval-api
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/leave_approval?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:leave_app}
spring.datasource.password=${DB_PASSWORD:leave_app}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=PT8H
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
springdoc.swagger-ui.path=/swagger-ui.html
