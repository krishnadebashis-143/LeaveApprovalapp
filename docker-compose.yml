services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: leave_approval
      MYSQL_USER: leave_app
      MYSQL_PASSWORD: leave_app
      MYSQL_ROOT_PASSWORD: local_root_only
    ports:
      - "3306:3306"
    volumes:
      - leave-approval-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  leave-approval-mysql:
